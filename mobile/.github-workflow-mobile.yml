# Published to the public repo as .github/workflows/mobile.yml. Builds the
# osmRouter Android APK on a runner with the Android toolchain and uploads it to
# the matching `mobile-v*` release. Run from the Actions tab (workflow_dispatch)
# or by pushing a `mobile-v*` tag.
name: mobile

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload to
        default: mobile-v1.0.0
  push:
    tags: ["mobile-v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      - name: Install deps
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Bundle the osmrouter Android binary
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          curl -fsSL -o android/app/src/main/jniLibs/arm64-v8a/libosmrouter.so \
            https://github.com/osm-API/osmrouter/releases/download/v1.2.1/osmrouter-android-arm64
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          APK=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -1)
          echo "built: $APK"
          cp "$APK" osmRouter-1.0.0-android.apk
          gh release upload "$TAG" osmRouter-1.0.0-android.apk --clobber -R "${{ github.repository }}"
