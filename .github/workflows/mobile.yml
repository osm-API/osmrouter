# Published to the public repo as .github/workflows/mobile.yml. Builds the
# osmRouter Android APK on a runner with the Android toolchain and uploads it to
# the matching `mobile-v*` release. Run from the Actions tab (workflow_dispatch)
# or by pushing a `mobile-v*` tag.
name: mobile

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload to
        default: mobile-v1.0.1
  push:
    tags: ["mobile-v*"]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3

      - name: Install deps
        working-directory: mobile
        run: npm install

      - name: Generate Android project
        working-directory: mobile
        run: npx expo prebuild --platform android --no-install

      - name: Bundle the osmrouter Android binary
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          curl -fsSL -o android/app/src/main/jniLibs/arm64-v8a/libosmrouter.so \
            https://github.com/osm-API/osmrouter/releases/download/v1.2.1/osmrouter-android-arm64
          ls -la android/app/src/main/jniLibs/arm64-v8a/

      - name: Build release APK
        working-directory: mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          APK=$(find mobile/android/app/build/outputs/apk -name "*.apk" | head -1)
          VERSION=$(node -p "require('./mobile/app.json').expo.version")
          OUT="osmRouter-${VERSION}-android.apk"
          echo "built: $APK -> $OUT"
          cp "$APK" "$OUT"
          # Drop any stale APK assets with a different version name on this
          # release. `|| true` guards the no-match case (grep exits 1) so
          # pipefail doesn't abort the step before the upload below.
          STALE=$(gh release view "$TAG" -R "${{ github.repository }}" --json assets \
            -q '.assets[].name' 2>/dev/null | grep -E '\.apk$' | grep -vx "$OUT" || true)
          for old in $STALE; do
            gh release delete-asset "$TAG" "$old" -y -R "${{ github.repository }}" || true
          done
          gh release upload "$TAG" "$OUT" --clobber -R "${{ github.repository }}"
